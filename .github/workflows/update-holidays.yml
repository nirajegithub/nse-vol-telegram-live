
name: Update NSE Trading Holidays

on:
  schedule:
    # 06:00 IST on January 1 (00:30 UTC)
    - cron: "30 0 1 1 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-holidays:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install --upgrade pip requests

      - name: Fetch and replace NSE CM holiday JSON
        run: python scripts/update_nse_holidays.py

      - name: Commit updated holiday file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nse_holidays.json
          if git diff --cached --quiet; then
            echo "No holiday changes detected."
          else
            git commit -m "Update NSE CM trading holidays"
            git push
          fi
