      - name: Get Telegram destination
        id: telegram
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          url = f"https://api.telegram.org/bot{token}/getChat"

          response = requests.get(
              url,
              params={"chat_id": chat_id},
              timeout=15
          )

          print("HTTP status:", response.status_code)
          response.raise_for_status()

          result = response.json()

          if not result.get("ok"):
              raise RuntimeError(f"Telegram getChat failed: {result}")

          chat = result["result"]

          print("")
          print("===== TELEGRAM DESTINATION =====")
          print("Title:", chat.get("title"))
          print("Username:", chat.get("username"))
          print("Type:", chat.get("type"))
          print("================================")

          # Write ID as a workflow output.
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"chat_id={chat.get('id')}\n")

          print("Telegram destination resolved successfully.")
          PY

      - name: Display resolved Chat ID
        run: |
          echo "Resolved Telegram Chat ID: ${{ steps.telegram.outputs.chat_id }}"
