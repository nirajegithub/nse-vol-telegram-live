name: NSE Telegram Monitor

"on":
  schedule:
    # 09:22 IST = 03:52 UTC
    - cron: "52 3 * * 1-5"

    # 09:37, 09:52
    # 10:07, 10:22, 10:37, 10:52
    # 11:07 ... 13:52
    # 14:07, 14:22
    - cron: "7,22,37,52 4-8 * * 1-5"

    # 14:37, 14:52 IST
    - cron: "7,22 9 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-telegram-monitor
  cancel-in-progress: false

jobs:
  telegram-monitor:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Telegram worker
        run: python telegram_worker.py

      - name: Show Git status
        run: git status --short
